name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "fastmcp>=3,<4" "pydantic>=2" email-validator pytest pytest-asyncio ruff
          pip install "anthropic>=0.69" "fastapi>=0.115" "uvicorn>=0.30" httpx

      - name: Test every skill
        run: |
          set -e
          for d in skills/*/ ; do
            echo "=== $d"
            (cd "$d" && python -m pytest tests -q)
          done

      - name: Test the gateway
        run: |
          cd deploy/gateway
          python -m pytest tests -q

      - name: Test the agent
        # No ANTHROPIC_API_KEY here on purpose - no agent test may call the real API.
        run: |
          cd deploy/agent
          python -m pytest tests -q

      - name: The landing page's constants must match the Python
        # The page ships a JS copy of the turnover-tax and VAT thresholds so it
        # works offline and without JS. That copy is GENERATED. If someone edits
        # a threshold in a skill and forgets to regenerate, the page would quietly
        # show the old number - the exact failure this project exists to argue
        # against. This fails the build instead.
        run: |
          python scripts/gen_web_constants.py --check

      - name: Lint (ruff)
        run: |
          ruff check skills deploy scripts
