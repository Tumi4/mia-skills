name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check skills/

      - name: Format check
        run: ruff format --check skills/

      - name: Install and test each skill
        run: |
          for skill_dir in skills/*/; do
            echo "Testing $skill_dir"
            cd "$skill_dir"
            pip install -e ".[dev]"
            pytest -v
            cd - > /dev/null
          done

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all skill.json files
        run: |
          pip install jsonschema
          python scripts/validate_schemas.py
